<!doctype html>
<html lang="ko"><head><meta charset="UTF-8">
<base href="/seed/"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#141414">
<title>신청 취소 | OOO Seed</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="style.css?v=7">
</head><body>
<header class="hd"><a class="hd__logo" href="/seed/"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M28.5 9.5A13 13 0 1 0 32 24.5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="20" cy="20" r="3" fill="#fff"/></svg>OOO Seed</a></header>
<main class="sec"><div class="wrap" style="max-width:720px">
<p class="kicker">Cohort 01</p><h1 class="h2" style="margin-top:16px" id="ct">신청 확인 중</h1>
<p class="lead" id="cl" style="margin-top:20px;color:var(--muted)"></p>
<div style="margin-top:36px;display:flex;gap:12px;flex-wrap:wrap" id="ca"></div>
</div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbxga8Z1FE1Imqpx3AyUYSIYRLslDVyeu4ekXqrKbRcT0qKKhj56nFsF-KjlXQ4ahDqQaA/exec';
const t=new URLSearchParams(location.search).get('t')||'';
const T=document.getElementById('ct'),L=document.getElementById('cl'),A=document.getElementById('ca');
const home='<a class="btn btn--ghost" href="/seed/">OOO Seed 홈</a>';
async function get(c){const r=await fetch(API+'?action=cancel&t='+encodeURIComponent(t)+(c?'&confirm=1':''));return r.json();}
(async()=>{try{const j=await get(false);
 if(!j.ok){T.textContent='신청을 찾을 수 없습니다';L.textContent='링크가 정확한지 확인해 주세요.';A.innerHTML=home;return;}
 if(j.status==='취소'){T.textContent='이미 취소된 신청입니다';L.textContent='신청번호 '+j.id+'.';A.innerHTML=home;return;}
 T.textContent=j.name+'님, 1기 신청을 취소할까요?';L.textContent='신청번호 '+j.id+'. 취소하면 선정 검토와 회차 안내에서 제외됩니다.';
 A.innerHTML='<button class="btn btn--w" id="go">신청 취소</button>'+home;
 document.getElementById('go').onclick=async()=>{const b=document.getElementById('go');b.disabled=true;const k=await get(true);
  if(k.ok&&k.status==='취소'){T.textContent='신청이 취소되었습니다';L.textContent='다음 기수 소식은 Luma 캘린더에서 확인할 수 있습니다.';A.innerHTML='<a class="btn" href="https://luma.com/ouroboros-ai" target="_blank" rel="noopener">Luma 캘린더 ↗</a>'+home;}
  else{L.textContent='처리하지 못했습니다. 잠시 후 다시 시도해 주세요.';b.disabled=false;}};
}catch(e){T.textContent='잠시 후 다시 시도해 주세요';L.textContent='연결에 문제가 있습니다.';A.innerHTML=home;}})();
</script></body></html>
